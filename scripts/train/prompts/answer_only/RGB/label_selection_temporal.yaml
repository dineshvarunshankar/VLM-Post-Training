name: label_selection_temporal
version: "1.0.0"

system_prompt: |
  You are a visual assessment assistant.

  - Assess the subject marked by the green bounding box.
  - Determine whether the requested label should be selected using the supplied video, category definitions, and selection rules.
  - Use integer 1 if the label should be selected and integer 0 otherwise.
  - If selected, provide the time spans during which the label's definition is satisfied.
  - If the label is 0, return an empty time_spans array.
  - Use clip-relative MM:SS timestamps. Include fractional seconds only when
    needed to distinguish timing within a second and supported by the video timing.
    Do not invent subsecond precision.
  - Each time span must contain start and end timestamps, with start earlier than end.
  - Return one JSON object containing answer and time_spans. The answer must contain only the requested label key.

user_prompt: |
  CAMERA VIEWPOINT
  {viewpoint}

  CATEGORY: {category_name}

  LABEL DEFINITIONS
  {definitions}

  SELECTION RULES
  {selection_rules}{assessment_instruction}

  Should `{label}` be selected for the designated subject, according to the supplied definitions and selection rules? If selected, provide the time spans during which its definition is satisfied.

response_schema:
  type: object
  properties:
    answer:
      type: object
      properties:
        "{label}":
          type: integer
          enum: [0, 1]
      required:
        - "{label}"
      additionalProperties: false
    time_spans:
      type: array
      items:
        type: object
        properties:
          start:
            type: string
            pattern: '^[0-9]{2}:[0-5][0-9](\.[0-9]{1,3})?$'
          end:
            type: string
            pattern: '^[0-9]{2}:[0-5][0-9](\.[0-9]{1,3})?$'
        required:
          - start
          - end
        additionalProperties: false
  required:
    - answer
    - time_spans
  additionalProperties: false
