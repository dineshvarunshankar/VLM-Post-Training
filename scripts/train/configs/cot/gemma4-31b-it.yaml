# Editable CoT draft inherited from the approved PSC shared 16 GPU recipe.
# Explicit media/split selection, immutable source manifest, and GPU smoke validation remain required.
schema_version: 2
run:
  name: gemma31b-native-stabilized-medical-scene-camera-cot-1
  date: '2026-11-02'
model: gemma4-31b-it
answer_format: cot
recipe: sft
paths:
  media_root: null
  split_dir: null
  weights_root: /ocean/projects/cis240120p/kandiyap/triage/base-weights
  output_root: /ocean/projects/cis240120p/kandiyap/triage/finetuned
  catalog: ../catalogs/RGB/label_catalog.yaml
  prompts: ../../prompts/answer_only/RGB/medical_vqa.yaml
execution:
  training_gpus: 16
  training_devices: null
  vllm_server_url: http://127.0.0.1:8000
  vllm_model_name: gemma4-31b-it
  vllm_gpu_sharing: true
dataset:
  modality: RGB
  sources:
  - native
  - stabilized
mixture:
  strategy: all_medical_plus_auxiliary
  shuffle: true
  resample_each_epoch: true
  medical_vqa:
    enabled: true
    sampling: all_valid
    excluded_categories:
    - subject_check
    context_sources:
    - native
  camera_view:
    enabled: true
    sources:
    - native
    questions_per_video_per_epoch: 1
  counting:
    enabled: false
    sources:
    - native
    - stabilized
    questions_per_video_per_epoch: 1
    timestamp_sampling: random_annotated
  subject_localization:
    enabled: false
    sources:
    - native
    - stabilized
    questions_per_video_per_epoch: 1
  label_questions:
    enabled: false
    excluded_categories:
    - subject_check
    - context
    sampling:
      observables: 2
      assessment: 2
      single_subcategory: 1
      prefer_positive_negative_pair: true
      without_replacement: true
      cap_to_available_labels: true
    grounding:
      spatial:
        enabled: false
      temporal:
        enabled: false
        temporal_labels_only: true
shared:
  method: lora
  attention: flex_attention
  max_length: 262144
  video:
    fps: 5
    qwen:
      max_pixels: 251658240
    gemma:
      max_soft_tokens: 140
    sources:
      native:
        fps: 5
        max_soft_tokens: 140
        max_pixels_per_frame: 322560
      stabilized:
        fps: 5
        max_soft_tokens: 140
        max_pixels_per_frame: 322560
  augmentation:
    enabled: false
    photometric:
      probability: 0.3
      brightness:
      - 0.95
      - 1.05
      contrast:
      - 0.95
      - 1.05
    horizontal_flip:
      enabled: false
  lora:
    r: 32
    lora_alpha: 32
    lora_dropout: 0.05
    bias: none
    use_rslora: false
  data_checks:
    stabilized_coordinates_verified: true
  evaluation:
    max_new_tokens: 1024
    generation:
      do_sample: false
      temperature: 0.0
      top_p: 1.0
      top_k: 0
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0
    sources:
    - native
    - stabilized
    aggregation: equal_source_macro_f1
  seed: 42
  data_loading:
    dataloader_num_workers: 4
    dataloader_persistent_workers: true
    dataloader_prefetch_factor: 1
    dataloader_pin_memory: true
    dataloader_multiprocessing_context: spawn
  cot:
    medical_max_new_tokens: 4096
    thinking_token_budget: 3064
    caption_max_new_tokens: 1024
    caption_review_samples: 16
    accepted_implementation_fingerprints: []
    release_manifest: null
    release_manifest_sha256: null
sft:
  effective_batch_size: 16
  training:
    fsdp: true
    fsdp_config:
      version: 2
      reshard_after_forward: true
      activation_checkpointing: true
      cpu_offload: false
      state_dict_type: FULL_STATE_DICT
    num_train_epochs: 5
    learning_rate: 0.00002
    per_device_train_batch_size: 1
    warmup_steps: 0.05
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-08
    max_grad_norm: 1.0
    lr_scheduler_type: cosine
    optim: adamw_torch_fused
    logging_steps: 1
    eval_strategy: epoch
    save_strategy: epoch
    save_total_limit: 3
    load_best_model_at_end: true
    metric_for_best_model: macro_f1
    greater_is_better: true
    accelerator_config:
      non_blocking: true
env_file: ../../../../.env
checkpoint: null
resume: null
