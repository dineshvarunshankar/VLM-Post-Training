# Starting allocation: 1 training GPU + 1 separate vLLM GPU; memory fit requires a smoke test.
schema_version: 2
run:
  name: gemma12b-stabilized-medical-auxiliary
  date: '2026-11-01'
model: gemma4-12b-it
answer_format: answer_only
recipe: sft
paths:
  media_root: /groups/gai51740/RBT3/dinesh_varun/triage/datasets
  split_dir: /groups/gai51740/RBT3/dinesh_varun/triage/datasets/08-train_val_test/2026-11-01/answer_only
  weights_root: /groups/gai51740/RBT3/dinesh_varun/triage/base-weights
  output_root: /groups/gai51740/RBT3/dinesh_varun/triage/finetuned
  catalog: ../catalogs/RGB/label_catalog.yaml
  prompts: ../../prompts/answer_only/RGB/medical_vqa.yaml
execution:
  training_gpus: 4
  training_devices: null
  vllm_server_url: http://127.0.0.1:8020
  vllm_model_name: gemma4-12b-it
dataset:
  modality: RGB
  sources:
  - stabilized
mixture:
  strategy: all_medical_plus_auxiliary
  shuffle: true
  resample_each_epoch: true
  medical_vqa:
    enabled: true
    sampling: all_valid
    excluded_categories:
    - subject_check
    context_sources:
    - native
  camera_view:
    enabled: false
    sources:
    - native
    questions_per_video_per_epoch: 1
  counting:
    enabled: true
    sources:
    - stabilized
    questions_per_video_per_epoch: 1
    timestamp_sampling: random_annotated
  subject_localization:
    enabled: true
    sources:
    - stabilized
    questions_per_video_per_epoch: 1
  label_questions:
    enabled: true
    excluded_categories:
    - subject_check
    - context
    sampling:
      observables: 2
      assessment: 2
      single_subcategory: 1
      prefer_positive_negative_pair: true
      without_replacement: true
      cap_to_available_labels: true
    grounding:
      spatial:
        enabled: true
      temporal:
        enabled: true
        temporal_labels_only: true
shared:
  method: lora
  attention: sdpa
  max_length: 262144
  video:
    fps: 10
    qwen:
      max_pixels: 251658240
    gemma:
      max_soft_tokens: 280
  augmentation:
    enabled: false
    photometric:
      probability: 0.3
      brightness:
      - 0.95
      - 1.05
      contrast:
      - 0.95
      - 1.05
    horizontal_flip:
      enabled: false
  lora:
    r: 32
    lora_alpha: 32
    lora_dropout: 0.05
    bias: none
    use_rslora: false
  data_checks:
    stabilized_coordinates_verified: true
  evaluation:
    max_new_tokens: 1024
    generation:
      do_sample: false
      temperature: 0.0
      top_p: 1.0
      top_k: 0
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0
    sources: [native, stabilized]
    aggregation: equal_source_macro_f1
  seed: 42
  data_loading:
    dataloader_num_workers: 4
    dataloader_persistent_workers: true
    dataloader_prefetch_factor: 1
    dataloader_pin_memory: true
    dataloader_multiprocessing_context: spawn
sft:
  effective_batch_size: 16
  training:
    fsdp: false
    fsdp_config:
      version: 2
      reshard_after_forward: true
      activation_checkpointing: true
      cpu_offload: false
      state_dict_type: FULL_STATE_DICT
    num_train_epochs: 3
    learning_rate: 0.0001
    per_device_train_batch_size: 1
    warmup_steps: 0.05
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-08
    max_grad_norm: 1.0
    lr_scheduler_type: cosine
    optim: adamw_torch
    logging_steps: 1
    eval_strategy: epoch
    save_strategy: epoch
    save_total_limit: 3
    load_best_model_at_end: true
    metric_for_best_model: macro_f1
    greater_is_better: true
    accelerator_config:
      non_blocking: true
env_file: ../../../../.env
checkpoint: null
resume: null
