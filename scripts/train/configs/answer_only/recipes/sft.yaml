recipe: sft_only
method: lora
attention: sdpa
max_length: 262144
effective_batch_size: 16
video:
  fps: 10
  qwen:
    max_pixels: 251658240
  gemma:
    max_soft_tokens: 280
augmentation:
  enabled: false
  photometric:
    probability: 0.3
    brightness: [0.95, 1.05]
    contrast: [0.95, 1.05]
  horizontal_flip:
    enabled: false
lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  use_rslora: false
data_checks:
  stabilized_coordinates_verified: false
evaluation:
  max_new_tokens: 1024
training:
  fsdp: true
  fsdp_config:
    version: 2
    reshard_after_forward: true
    activation_checkpointing: true
    cpu_offload: false
    state_dict_type: FULL_STATE_DICT
  seed: 42
  num_train_epochs: 3
  learning_rate: 0.0001
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  warmup_steps: 0.05
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 0.00000001
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  optim: adamw_torch
  logging_steps: 1
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: macro_f1
  greater_is_better: true
  dataloader_num_workers: 4
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 1
  dataloader_pin_memory: true
  dataloader_multiprocessing_context: spawn
  accelerator_config:
    non_blocking: true
