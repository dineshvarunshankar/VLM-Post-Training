[project]
name = "vlm-post-training"
version = "0.2.0"
description = "Triage media preparation, annotation generation, and model fine-tuning"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.9,<3",
    "torchvision>=0.24",
    "torchcodec>=0.8",
    "transformers>=5.21,<6",
    "peft>=0.21,<1",
    "trl==1.16.0",
    "xgrammar==0.2.8",
    "requests>=2.32,<3",
    "boto3>=1.43,<2",
    "accelerate>=1.10,<2",
    "google-genai>=2.33.0",
    "jsonschema>=4.26.0",
    "litellm>=1.106.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "wandb>=0.25,<1",
    "fla-core==0.6.0",
]

[tool.uv]
package = false

[dependency-groups]
rl = ["vllm==0.30.0"]
